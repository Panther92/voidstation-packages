name: Build packages

# claude/** branches and pull requests: test build only (no key, no upload).
# main: build, then the job "publish" waits for approval in the environment
# "release"; only that job can read the signing key.

on:
  push:
    branches: [main, 'claude/**']
  # Branches of this repository are built by their push already (the PR shows
  # those checks); pull_request only builds pull requests from forks.
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Templates to build: "all", or names separated by spaces'
        required: true
        default: all
      publish:
        description: Publish after the build (main only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: What to build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.packages }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          list="$(bash ci/plan.sh)"
          count="$(wc -w <<< "$list")"
          echo "packages=$list" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### Templates to build ($count)"
            for p in $list; do echo "- \`$p\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
    container:
      image: ghcr.io/void-linux/void-glibc-full:20250901R1
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y sudo bash git curl python3
          useradd -G xbuilder -M builder

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: void-packages + our templates
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          bash ci/prepare.sh "$GITHUB_WORKSPACE/vp"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          PKGS: ${{ needs.plan.outputs.packages }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          sudo -Eu builder bash ci/build.sh "$GITHUB_WORKSPACE/vp" "$ARCH" $PKGS 2>&1 | tee build.log

      - name: Report failure
        if: failure()
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: bash ci/annotate.sh "Build $ARCH failed" build.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkgs-${{ matrix.arch }}
          path: vp/hostdir/binpkgs/*.xbps
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Sign and publish
    needs: [plan, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'))
    runs-on: ubuntu-24.04
    environment: release
    container:
      image: ghcr.io/void-linux/void-glibc-full:20250901R1
      options: --platform linux/amd64
    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y bash git curl python3 openssl openssh rsync

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkgs-*
          path: artifacts

      - name: Sign and upload
        shell: bash
        env:
          XBPS_PRIVKEY: ${{ secrets.XBPS_PRIVKEY }}
          REPO_URL: ${{ vars.REPO_URL }}
          UPLOAD: ${{ vars.UPLOAD }}
          RSYNC_TARGET: ${{ vars.RSYNC_TARGET }}
          UPLOAD_KNOWN_HOSTS: ${{ vars.UPLOAD_KNOWN_HOSTS }}
          UPLOAD_SSH_KEY: ${{ secrets.UPLOAD_SSH_KEY }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_PATH: ${{ vars.BUNNY_PATH }}
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: bash ci/publish.sh artifacts signed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-repository
          path: signed/
          retention-days: 30
